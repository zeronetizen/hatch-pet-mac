name: build

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -x
          swift --version
          xcodebuild -version || true
          uname -m

      - name: Assemble app
        run: |
          set -eo pipefail
          bash assemble_app.sh 2>&1 | tee build-output.log

      - name: Publish build log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: HatchPet build log ${{ github.run_number }}
          files: build-output.log
          fail_on_unmatched_files: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HatchPet-mac
          path: HatchPet-mac.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HatchPet build ${{ github.run_number }}
          files: HatchPet-mac.zip
          fail_on_unmatched_files: true
