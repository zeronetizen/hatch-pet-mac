name: build

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -x
          swift --version
          xcodebuild -version || true
          uname -m

      - name: Assemble app
        run: |
          set -eo pipefail
          bash assemble_app.sh 2>&1 | tee build-output.log

      - name: Publish build log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: HatchPet build log ${{ github.run_number }}
          files: build-output.log
          fail_on_unmatched_files: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HatchPet-mac
          path: HatchPet-mac.zip

      # 发版规范（v0.11 起）：正式 Release 的 tag 用语义版本 v<CFBundleShortVersionString>、
      # 标题含版本号——App 内自助更新（UpdateChecker）按 tag 解析版本比较新旧；
      # 构建日志仍走上面的 debug-<run> Release，两者互不干扰。
      - name: Resolve version
        id: version
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Packaging/Info.plist)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "正式发版版本：v${VERSION}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: HatchPet v${{ steps.version.outputs.version }}
          body: |
            HatchPet Mac 版 v${{ steps.version.outputs.version }}（构建 #${{ github.run_number }}）。
            安装包：HatchPet-mac.zip（解压后右键打开绕过 Gatekeeper）。
            变更细节见仓库 README 的 v${{ steps.version.outputs.version }} 小节。
          files: HatchPet-mac.zip
          fail_on_unmatched_files: true
